<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Anna ❤️</title>
    <!-- Importing a beautiful, romantic Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            /* Softer, dreamier pink gradient */
            background: linear-gradient(135deg, #ffe6e6 0%, #ffb6c1 50%, #ff69b4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            position: relative;
        }

        /* Floating background hearts */
        .bg-heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.4);
            font-size: 20px;
            animation: floatUp 10s linear infinite;
            bottom: -50px;
            z-index: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        .container {
            /* Glassmorphism effect */
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(216, 27, 96, 0.15);
            width: 90%;
            max-width: 520px;
            text-align: center;
            position: relative;
            z-index: 10;
            transition: all 0.5s ease;
        }

        /* Elegant Serif font for titles */
        h1 {
            font-family: 'Playfair Display', serif;
            color: #ad1457;
            margin-bottom: 15px;
            font-size: 32px;
            font-style: italic;
        }

        /* Highlighting the name Anna */
        .name-highlight {
            font-size: 42px;
            color: #d81b60;
            display: block;
            margin-top: 5px;
            text-shadow: 2px 2px 4px rgba(216, 27, 96, 0.2);
            font-style: normal;
            font-weight: 600;
        }

        p {
            color: #6a1b29;
            margin-bottom: 25px;
            font-size: 17px;
            font-weight: 300;
            line-height: 1.6;
        }
        
        textarea {
            width: 100%;
            height: 130px;
            padding: 18px;
            border: 2px solid rgba(216, 27, 96, 0.2);
            background: rgba(255, 255, 255, 0.8);
            border-radius: 12px;
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
            resize: none;
            outline: none;
            margin-bottom: 25px;
            transition: all 0.3s;
            color: #333;
        }
        
        textarea:focus {
            border-color: #d81b60;
            box-shadow: 0 0 10px rgba(216, 27, 96, 0.1);
            background: #fff;
        }

        button {
            background: linear-gradient(to right, #d81b60, #ff4081);
            color: white;
            border: none;
            padding: 16px 45px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 400;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(216, 27, 96, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(216, 27, 96, 0.4);
        }

        /* Hide all steps except the active one */
        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.6s ease-in-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Emoji Explosion Styling */
        .emoji {
            position: absolute;
            font-size: 35px;
            pointer-events: none;
            animation: explode 2.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            z-index: 5;
        }

        @keyframes explode {
            0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
            50% { opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(2) rotate(45deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Background floating hearts script will generate these -->
    <div id="bg-container"></div>

    <div class="container">
        
        <!-- STEP 1 -->
        <div id="step1" class="step active">
            <h1>Hello Beautiful, <span class="name-highlight">Anna</span></h1>
            <p>What part of knowing me makes you happy?</p>
            <textarea id="answer1" placeholder="Write your answer here..."></textarea>
            <button onclick="submitAnswer1()">Submit</button>
        </div>

        <!-- STEP 2 -->
        <div id="step2" class="step">
            <h1>One more thing...</h1>
            <p>Tell me anything you don't like from me and you never said.</p>
            <textarea id="answer2" placeholder="Be honest..."></textarea>
            <button onclick="submitAnswer2()">Submit</button>
        </div>

        <!-- STEP 3 -->
        <div id="step3" class="step">
            <h1>Last question 🌸</h1>
            <p>When are you always free to talk?</p>
            <textarea id="answer3" placeholder="I'm listening..."></textarea>
            <button onclick="submitAnswer3()">Finish</button>
        </div>

        <!-- FINAL MESSAGE -->
        <div id="finalMessage" class="step">
            <h1>Message Delivered 💌</h1>
            <p style="font-size: 22px; font-weight: 400; color: #d81b60; line-height: 1.8;">
                That smile fits better on your face.<br>Smile always, girl. 😊
            </p>
        </div>

    </div>

    <script>
        // --- Background Floating Hearts ---
        const bgContainer = document.getElementById('bg-container');
        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.className = 'bg-heart';
            heart.innerText = '❤';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
            heart.style.opacity = Math.random() * 0.5 + 0.2;
            heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
            bgContainer.appendChild(heart);
            
            setTimeout(() => { heart.remove(); }, 10000);
        }
        setInterval(createFloatingHeart, 400);

        // --- Emoji Explosion Function ---
        function triggerEmojiExplosion() {
            const emojis = ['❤️', '💖', '💘', '💕', '🌸', '✨', '💍', '🌹'];
            const container = document.body;

            for (let i = 0; i < 50; i++) { // Increased to 50 for a bigger explosion
                const emojiElement = document.createElement('div');
                emojiElement.className = 'emoji';
                emojiElement.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                
                // Start position in the center of the screen
                emojiElement.style.left = '50%';
                emojiElement.style.top = '50%';

                // Random trajectories for a wider explosion
                const x = (Math.random() - 0.5) * 1200 + 'px';
                const y = (Math.random() - 0.5) * 1200 + 'px';
                
                emojiElement.style.setProperty('--x', x);
                emojiElement.style.setProperty('--y', y);

                container.appendChild(emojiElement);

                setTimeout(() => { emojiElement.remove(); }, 2500);
            }
        }

        // --- Step Transitions ---
        function submitAnswer1() {
            if (document.getElementById('answer1').value.trim() === '') {
                alert("Please write something beautiful first! 😊");
                return;
            }
            triggerEmojiExplosion();

            setTimeout(() => {
                document.getElementById('step1').classList.remove('active');
                document.getElementById('step2').classList.add('active');
            }, 1000);
        }

        function submitAnswer2() {
            if (document.getElementById('answer2').value.trim() === '') {
                alert("Don't be shy, tell me! ❤️");
                return;
            }
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step3').classList.add('active');
        }

        function submitAnswer3() {
            if (document.getElementById('answer3').value.trim() === '') {
                alert("I need to know when to talk to you! 🌸");
                return;
            }
            document.getElementById('step3').classList.remove('active');
            document.getElementById('finalMessage').classList.add('active');
            
            triggerEmojiExplosion();
        }
    </script>

</body>
</html>
